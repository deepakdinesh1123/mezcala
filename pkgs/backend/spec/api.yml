openapi: 3.0.4
info:
  title: Mezcala API
  version: 0.0.1
  description: API for managing databases via Mezcala.

servers:
  - url: https://mezcala.net/api

tags:
  - name: databases
    description: Register, create, and manage database connections.
  - name: database-sync
    description: Configure and trigger sync rules between databases.
  - name: tasks
    description: Query the status and result of async operations.
  - name: health
    description: Service health and availability.

paths:

  # ─── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: checkHealth
      tags:
        - health
      summary: Check Mezcala health
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Databases ─────────────────────────────────────────────────────────────

  /databases/supported:
    get:
      operationId: getSupportedEngines
      tags:
        - databases
      summary: List all supported database engines and versions
      responses:
        '200':
          $ref: '#/components/responses/SupportedEnginesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/create:
    post:
      operationId: createDatabase
      tags:
        - databases
      summary: Create a new managed database
      description: >
        Initiates database creation asynchronously. Returns a task ID that can
        be polled via `GET /databases/create/tasks/{taskID}`. On completion the
        task result contains an acknowledgment with the new database ID.
      requestBody:
        $ref: '#/components/requestBodies/DatabaseRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/create/tasks/{taskID}:
    get:
      operationId: getCreateDatabaseTaskStatus
      tags:
        - tasks
      summary: Get the status of a createDatabase task
      description: >
        Polls the status of a task initiated by `POST /databases/create`.
        When `status` is `completed` the `result` field contains a
        `DatabaseAcknowledgment` with the new database ID.
      parameters:
        - $ref: '#/components/parameters/taskID'
      responses:
        '200':
          description: Task status for a createDatabase operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDatabaseTaskStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/add:
    post:
      operationId: addDatabase
      tags:
        - databases
      summary: Register an existing external database
      description: >
        Synchronously registers an external database connection and returns an
        acknowledgment with the assigned database ID.
      requestBody:
        $ref: '#/components/requestBodies/DatabaseRequest'
      responses:
        '201':
          $ref: '#/components/responses/DatabaseAcknowledgmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/delete:
    delete:
      operationId: deleteDatabase
      tags:
        - databases
      summary: Delete a database by ID
      description: >
        Initiates database deletion asynchronously. Returns a task ID that can
        be polled via `GET /databases/{dbID}/delete/tasks/{taskID}`. On
        completion the task result contains a confirmation message.
      parameters:
        - $ref: '#/components/parameters/dbID'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/delete/tasks/{taskID}:
    get:
      operationId: getDeleteDatabaseTaskStatus
      tags:
        - tasks
      summary: Get the status of a deleteDatabase task
      description: >
        Polls the status of a task initiated by `DELETE /databases/{dbID}/delete`.
        When `status` is `completed` the `result` field contains a
        `DeletionAcknowledgment`.
      parameters:
        - $ref: '#/components/parameters/dbID'
        - $ref: '#/components/parameters/taskID'
      responses:
        '200':
          description: Task status for a deleteDatabase operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDatabaseTaskStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/connection-url:
    get:
      operationId: getDatabaseConnectionUrl
      tags:
        - databases
      summary: Get the connection URL for a database
      description: >
        Returns the fully-formed connection URL for the specified database,
        including credentials. Handle with care — treat the response as a secret.
      parameters:
        - $ref: '#/components/parameters/dbID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionUrlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Database Sync ─────────────────────────────────────────────────────────

  /databases/{dbID}/sync/init:
    post:
      operationId: createSyncRule
      tags:
        - database-sync
      summary: Create a new sync rule for a database
      description: >
        Synchronously creates a sync rule and returns it with its assigned ID.
      parameters:
        - $ref: '#/components/parameters/dbID'
      requestBody:
        $ref: '#/components/requestBodies/SyncRuleRequest'
      responses:
        '201':
          $ref: '#/components/responses/SyncRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/sync/{syncID}/update:
    put:
      operationId: updateSyncRule
      tags:
        - database-sync
      summary: Update an existing sync rule
      description: >
        Synchronously updates a sync rule and returns the updated record.
      parameters:
        - $ref: '#/components/parameters/dbID'
        - $ref: '#/components/parameters/syncID'
      requestBody:
        $ref: '#/components/requestBodies/SyncRuleRequest'
      responses:
        '200':
          $ref: '#/components/responses/SyncRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/sync/{syncID}/delete:
    delete:
      operationId: deleteSyncRule
      tags:
        - database-sync
      summary: Delete a sync rule
      description: Synchronously deletes a sync rule.
      parameters:
        - $ref: '#/components/parameters/dbID'
        - $ref: '#/components/parameters/syncID'
      responses:
        '204':
          description: Sync rule deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/sync:
    put:
      operationId: executeSyncRule
      tags:
        - database-sync
      summary: Trigger execution of a sync rule
      description: >
        Triggers a sync rule run asynchronously. Returns a task ID that can be
        polled via `GET /databases/{dbID}/sync/{syncID}/tasks/{taskID}`. On completion
        the task result contains the sync execution summary.
      parameters:
        - $ref: '#/components/parameters/dbID'
      requestBody:
        required: true
        description: Identifies which sync rule to execute.
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  format: int64
                  description: ID of the sync rule to execute
                  example: 7
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /databases/{dbID}/sync/{syncID}/tasks/{taskID}:
    get:
      operationId: getExecuteSyncTaskStatus
      tags:
        - tasks
      summary: Get the status of an executeSyncRule task
      description: >
        Polls the status of a task initiated by `PUT /databases/{dbID}/sync`.
        When `status` is `completed` the `result` field contains a
        `SyncExecutionResult` with timing and outcome details.
      parameters:
        - $ref: '#/components/parameters/dbID'
        - $ref: '#/components/parameters/syncID'
        - $ref: '#/components/parameters/taskID'
      responses:
        '200':
          description: Task status for an executeSyncRule operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteSyncTaskStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:
    dbID:
      name: dbID
      in: path
      description: Unique identifier of the database
      required: true
      schema:
        type: integer
        format: int64
        example: 42

    syncID:
      name: syncID
      in: path
      description: Unique identifier of the sync rule
      required: true
      schema:
        type: integer
        format: int64
        example: 7

    taskID:
      name: taskID
      in: path
      description: Unique identifier of the async task
      required: true
      schema:
        type: string
        format: uuid
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

  schemas:

    # ── Errors ────────────────────────────────────────────────────────────────

    Error:
      type: object
      description: Standard error envelope returned for all 4xx and 5xx responses.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable description of the error
          example: The requested resource was not found.
        details:
          type: object
          description: Optional additional context about the error
          additionalProperties: true

    # ── Task schemas ──────────────────────────────────────────────────────────

    TaskReference:
      type: object
      description: Returned immediately when an async operation is accepted.
      required:
        - task_id
      properties:
        task_id:
          type: string
          format: uuid
          description: Unique identifier for the async task
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    TaskStatusBase:
      type: object
      description: >
        Common fields shared by all task status responses. When `status` is
        `completed` the operation-specific `result` field is populated.
        When `status` is `failed` the `error` field is populated.
      required:
        - task_id
        - status
        - created_at
      properties:
        task_id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          example: completed
        created_at:
          type: string
          format: date-time
          example: "2024-06-01T12:00:00Z"
        completed_at:
          type: string
          format: date-time
          example: "2024-06-01T12:00:05Z"
        message:
          type: string
          description: Human-readable status message
          example: Task completed successfully.
        error:
          $ref: '#/components/schemas/Error'

    CreateDatabaseTaskStatus:
      description: >
        Task status for a `createDatabase` operation. On completion, `result`
        contains the new database ID.
      allOf:
        - $ref: '#/components/schemas/TaskStatusBase'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/DatabaseAcknowledgment'

    DeleteDatabaseTaskStatus:
      description: >
        Task status for a `deleteDatabase` operation. On completion, `result`
        contains a deletion confirmation.
      allOf:
        - $ref: '#/components/schemas/TaskStatusBase'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/DeletionAcknowledgment'

    ExecuteSyncTaskStatus:
      description: >
        Task status for an `executeSyncRule` operation. On completion, `result`
        contains sync timing and outcome details.
      allOf:
        - $ref: '#/components/schemas/TaskStatusBase'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/SyncExecutionResult'

    # ── Database schemas ──────────────────────────────────────────────────────

    DatabaseConfig:
      type: object
      description: Connection configuration for a database.
      required:
        - engine
        - host
        - port
        - username
        - password
      properties:
        name:
          type: string
          example: my-database
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: s3cr3t
        engine:
          type: string
          example: postgres
        version:
          type: string
          example: "15"
        alias:
          type: string
          description: Optional human-friendly label
          example: prod-db
        host:
          type: string
          example: db.example.com
        port:
          type: string
          example: "5432"
        ssl_mode:
          type: string
          example: require
        path:
          type: string
          description: Optional filesystem path for local/embedded engines
          example: /var/lib/mydb
        role:
          type: string
          description: Database role for connection
          example: readonly
        image:
          type: string
          description: The docker image to use
          example: postgres:15

    DatabaseAcknowledgment:
      type: object
      description: >
        Confirmation returned after a database is successfully created or
        registered. Contains only the system-assigned ID.
      required:
        - id
        - message
      properties:
        id:
          type: integer
          format: int64
          description: System-assigned unique identifier for the new database
          example: 42
        message:
          type: string
          example: Database created successfully.

    DeletionAcknowledgment:
      type: object
      description: Confirmation that a resource was deleted.
      required:
        - message
      properties:
        message:
          type: string
          example: Resource deleted successfully.

    # ── Sync schemas ──────────────────────────────────────────────────────────

    SyncRuleConfig:
      type: object
      description: Configuration for syncing data between databases with optional masking rules.
      required:
        - from
        - to
      properties:
        from:
          type: integer
          format: int64
          description: Source database ID registered in Mezcala
          example: 1
        to:
          type: integer
          format: int64
          description: Destination database ID registered in Mezcala
          example: 2
        exclude:
          type: array
          description: Table names to exclude from the sync
          items:
            type: string
          example: [audit_logs, temp_data]
        schemas:
          type: array
          description: Schemas to include in the sync
          items:
            type: string
          default: [public]
          example: [public, analytics]
        data_rules:
          type: object
          description: >
            Column-level anonymization rules. Keys are column names or glob-style
            patterns (e.g. encrypted_*). Use null to drop a column entirely.
          additionalProperties:
            type: string
          example:
            email: MASKED
            encrypted_*: null

    SyncExecutionResult:
      type: object
      description: Outcome details of a sync rule execution.
      required:
        - sync_id
        - status
      properties:
        sync_id:
          type: integer
          format: int64
          example: 7
        status:
          type: string
          example: completed
        started_at:
          type: string
          format: date-time
          example: "2024-06-01T12:00:00Z"
        finished_at:
          type: string
          format: date-time
          example: "2024-06-01T12:00:42Z"
        tables_synced:
          type: integer
          description: Number of tables processed during the sync
          example: 14
        rows_synced:
          type: integer
          description: Total number of rows written to the destination
          example: 58320
        message:
          type: string
          example: Sync completed successfully.

  # ── Request bodies ──────────────────────────────────────────────────────────

  requestBodies:
    DatabaseRequest:
      required: true
      description: Payload for registering or creating a database connection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DatabaseConfig'

    SyncRuleRequest:
      required: true
      description: Payload for creating or updating a sync rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncRuleConfig'

  # ── Responses ───────────────────────────────────────────────────────────────

  responses:

    HealthResponse:
      description: Service is reachable and reports its current status.
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
              version:
                type: string
                example: 1.2.3

    SupportedEnginesResponse:
      description: Array of supported database engines and their available versions.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - engine
                - versions
              properties:
                engine:
                  type: string
                  example: postgres
                versions:
                  type: array
                  items:
                    type: string
                  example: ["14", "15", "16"]

    DatabaseAcknowledgmentResponse:
      description: The database was registered or created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DatabaseAcknowledgment'

    SyncRuleResponse:
      description: The created or updated sync rule.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SyncRuleConfig'
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    format: int64
                    description: System-assigned sync rule identifier
                    example: 7

    TaskAccepted:
      description: >
        The operation has been accepted and is running asynchronously.
        Poll the corresponding task status endpoint to track progress.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskReference'

    ConnectionUrlResponse:
      description: The connection URL for the specified database.
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - connection_url
            properties:
              id:
                type: integer
                format: int64
                description: Database ID
                example: 42
              connection_url:
                type: string
                description: >
                  Fully-formed connection URL including credentials.
                  Treat as a secret.
                example: "postgres://admin:s3cr3t@db.example.com:5432/my-database?sslmode=require"

    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: "Field 'engine' is required."

    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Database with the given ID was not found.

    Conflict:
      description: The resource already exists or violates a uniqueness constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: A database with this name already exists.

    UnprocessableEntity:
      description: The request is well-formed but contains semantic errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNPROCESSABLE_ENTITY
            message: Source and destination databases cannot be the same.

    InternalServerError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred. Please try again later.